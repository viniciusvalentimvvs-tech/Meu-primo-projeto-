<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Meu Personagem</title>

<style>
body {
    background: #b9eaff;
    text-align: center;
    font-family: Arial;
}

h1 {
    color: #ff6600;
}

.personagem {
    width: 200px;
    height: 200px;
    background: #ffd93d;
    border-radius: 50%;
    margin: 50px auto;
    position: relative;
}

.olho {
    width: 25px;
    height: 35px;
    background: black;
    border-radius: 50%;
    position: absolute;
    top: 65px;
}

.esquerdo {
    left: 50px;
}

.direito {
    right: 50px;
}

.boca {
    width: 60px;
    height: 25px;
    border-bottom: 5px solid black;
    border-radius: 50%;
    position: absolute;
    top: 115px;
    left: 70px;
}

</style>
</head>

<body>

<h1>Conheça o Gael!</h1>

<div class="personagem">
    <div class="olho esquerdo"></div>
    <div class="olho direito"></div>
    <div class="boca"></div>
</div>

<h2>Olá, amiguinhos!</h2>

<p>Este é meu primeiro personagem.</p>

</body>
</html>
